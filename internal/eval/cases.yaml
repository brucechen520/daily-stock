# LLM 輸出忠實度 golden set。
# 每 case：輸入數據（真值）→ 生成摘要 → 斷言：
#   must_mention:  代入後輸出必須出現的字串（數字正確性 + 方向不曲解）
#   forbidden:     不可出現的字串（案例特定；通用建議黑名單另在程式裡）
# 數字類斷言可靠因為模板代入——出現就一定是真值；這裡驗的是「該提的有提、方向沒講反」。

