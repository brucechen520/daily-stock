# 投資術語辭典。report 的【術語小教室】直接引用這裡的 explanation（determinstic，LLM 不得改寫定義）。
# keywords：當日摘要素材含任一關鍵字時，該術語視為「當日相關」可入選教學。
- term: 買超/賣超
  keywords: [買超, 賣超]
  explanation: 法人當日買進金額扣掉賣出金額後的淨額。正值（買超）代表淨買進，常被視為偏多訊號之一；負值（賣超）代表淨賣出。
- term: 外資
  keywords: [外資]
  explanation: 外國機構投資人。資金規模大、動向常影響大盤走勢，其連續買超或賣超常被視為中期方向的參考之一。
- term: 投信
  keywords: [投信]
  explanation: 國內證券投資信託公司（基金公司）。操作常反映國內法人對個股基本面的看法，月底常有作帳行情的討論。
- term: 自營商
  keywords: [自營商]
  explanation: 證券商用自有資金進出市場的部門。進出快、短線性質強，單日買賣超的方向參考性通常低於外資與投信。
- term: 三大法人
  keywords: [三大法人, 法人]
  explanation: 外資、投信、自營商的合稱。三者合計買賣超金額是觀察市場資金動向最常用的指標之一。
- term: 加權指數
  keywords: [加權指數, 大盤]
  explanation: 台灣證券交易所發行量加權股價指數（TAIEX），以市值加權計算，市值越大的公司對指數影響越大。
- term: 成交量
  keywords: [成交量, 量能]
  explanation: 當日成交的股數或金額。量是價的先行參考之一——價漲量增常被解讀為動能較健康，價漲量縮則追價意願不足。
- term: 收盤價
  keywords: [收盤, 收在]
  explanation: 當日最後一筆撮合的成交價格，台股收盤時間為 13:30。收盤價是計算指數漲跌與技術指標的基準。
- term: 漲跌幅
  keywords: [漲, 跌, "%"]
  explanation: 價格變動相對前一日收盤的百分比。台股個股單日漲跌幅上限為 10%。
- term: 整理格局
  keywords: [整理, 盤整]
  explanation: 指數或個股在一個區間內來回波動、沒有明顯趨勢方向的狀態，常見於多空力道暫時平衡時。
- term: 多頭/空頭
  keywords: [偏多, 偏空, 多頭, 空頭]
  explanation: 多頭指看漲或上漲趨勢，空頭指看跌或下跌趨勢。「偏多訊號」意指該現象在歷史上較常伴隨上漲，並非保證。
- term: 權值股
  keywords: [權值股, 台積電]
  explanation: 市值占加權指數比重大的股票（如台積電）。權值股漲跌對指數影響遠大於中小型股，看大盤先看權值股。
