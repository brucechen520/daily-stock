# Phase 2 — 技術指標 + 訊號引擎 + 回測方法論

## 目標

在 Phase 1 的資料基礎上，加入技術指標計算與籌碼因子，把「因子」組合成「訊號」，並且用嚴謹的回測方法驗證訊號是否真的有效，**回測站不住的規則不進入正式輸出**。

這個 phase 是整個專案技術含金量最高的部分，也是面試最容易被深挖的地方，因為「回測方法論嚴不嚴謹」直接反映開發者是不是真的懂金融資料的陷阱，還是只是套個公式跑跑看。

## 子模組拆解

### 1. `internal/indicator` — 技術指標與籌碼因子

**技術指標**（皆為公開公式，注意計算視窗要對齊實際交易日，不是自然日）：
- MA（移動平均線）：5日、20日、60日
- KD：RSV → K → D 的遞迴計算，注意第一筆資料的初始值處理（通常設 50）
- MACD：EMA12、EMA26、DIF、MACD 訊號線
- RSI：14日為主流參數

**籌碼因子**（這部分是這個專案的差異化重點，比純技術指標更少人做）：
- 外資連買/連賣天數
- 三大法人買賣超金額的 N 日移動平均（避免單日雜訊）
- 買賣超金額 / 成交量比值（衡量法人動作相對於市場熱度的強度）

```go
type Factor struct {
    Name  string
    Value float64
    // 因子計算當下所用到的資料截止時間，用於後續防止 look-ahead
    AsOfDate time.Time
}
```

### 2. `internal/signal` — 因子打分與訊號分級

簡單線性加權開始（之後可以換成更複雜的模型，但初版建議先用可解釋的規則）：

```go
type SignalScore struct {
    Symbol string
    Score  float64 // -100 ~ 100，負值偏空，正值偏多
    Factors map[string]float64 // 各因子貢獻分數，方便解釋
}
```

**訊號分級範例**：
| Score 範圍 | 分級 | 意義 |
|---|---|---|
| 60~100 | 強勢偏多 | 多項因子同時偏多 |
| 20~59 | 溫和偏多 | 部分因子偏多 |
| -19~19 | 中性 | 無明顯方向 |
| -59~-20 | 溫和偏空 | 部分因子偏空 |
| -100~-60 | 強勢偏空 | 多項因子同時偏空 |

**重要**：分數與分級只是「研究產出」，不是「買賣建議」。LLM 在 Phase 1 建立的紀律要延續——輸出時一律用「訊號研究」、「因子分析」等中性詞彙。

## 回測方法論（核心）

這部分決定整個訊號系統可不可信，逐一說明常見陷阱與對應做法。

### 陷阱 1：Look-ahead Bias（用到未來資訊）

**問題**：例如財報因子，如果用「財報所屬季度」去對應交易日，會不小心用到「還沒公布」的資訊。Q2 財報通常 8 月中才公布，但如果程式邏輯用「Q2 資料」去算 7 月的訊號，就是用了未來才存在的資訊。

**解法**：
- 每個因子都要記錄「實際公開時間」（`AsOfDate`），而不是「所屬期間」
- 回測時嚴格用「訊號產生當下，這筆資料是否已公開」做過濾
- 建議寫一個 `AssertNoLookAhead()` 檢查函式，在回測跑之前先驗證資料時間軸邏輯正確

```go
// 錯誤示範：用財報所屬季度去對應價格資料
// 正確：用財報「公布日」去對應，公布日之後才能用於當天訊號計算
if factor.PublishDate.After(signalDate) {
    return errors.New("look-ahead detected: factor published after signal date")
}
```

### 陷阱 2：Survivorship Bias（倖存者偏差）

**問題**：如果回測股票池只包含「現在還在市場上的公司」，會漏掉已下市（下市通常代表經營不善或財務問題）的公司，導致回測勝率被高估。

**解法**：
- 理想情況：用「回測當時的完整股票池」（含後來下市的公司），但這需要歷史成分股資料，免費資料源通常拿不到，這是已知限制
- 折衷做法：至少在文件中誠實揭露這個限制，並且優先選擇「大型權值股」或「上市滿一定年限」的股票池，降低下市機率對結果的扭曲程度
- 這個限制建議直接寫進 README 的 Known Limitations，不要隱藏

### 陷阱 3：Overfitting（過度擬合歷史資料）

**問題**：如果反覆調整因子權重、參數，直到歷史資料勝率好看為止，這組參數在樣本外（未來）大概率會失效，因為你等於是在「背答案」而不是「找規律」。

**解法：Walk-forward 驗證**

不要用「全部歷史資料調參 → 全部歷史資料測試」這種同一份資料訓練又測試的做法。改用滾動視窗：

```
時間軸: |----訓練期----|--測試期--|
                |----訓練期----|--測試期--|
                        |----訓練期----|--測試期--|
```

具體做法：
1. 把歷史資料切成多個滾動視窗，例如訓練期 12 個月、測試期 3 個月
2. 只用訓練期資料決定因子權重/參數
3. 用「沒看過」的測試期資料驗證勝率
4. 往前滾動視窗，重複這個過程，把每一段測試期的結果串起來看整體穩定度

**驗證指標**（不是只看單一勝率數字）：
- 各個滾動視窗的勝率是否穩定（如果第一段 70% 第二段 30%，代表規則不穩定，很可能是巧合）
- 與「隨機買進」或「持有大盤」的 baseline 比較，訊號要顯著優於隨機才有意義
- 最大回撤（Max Drawdown）：不是只看平均報酬，要看最壞情況會虧多少

```go
type BacktestResult struct {
    WindowResults []WindowResult
    OverallWinRate float64
    WinRateStdDev  float64 // 各視窗勝率的標準差，越小代表越穩定
    BaselineComparison float64 // 相對於持有大盤的超額表現
    MaxDrawdown float64
}
```

### 陷阱 4：交易成本被忽略

**問題**：回測常見錯誤是假設「買進賣出零成本」，但實際上手續費、證交稅（賣出 0.3%）會吃掉不少報酬，尤其是短線頻繁交易的規則。

**解法**：回測時內建基本交易成本假設（例如來回成本抓 0.4-0.5%），沒扣成本的勝率不能當作最終結論，只能當參考。

## 回測結果呈現原則

- 訊號只有在通過 walk-forward 驗證、且勝率穩定顯著優於 baseline 時，才進入 Phase 1 的白話摘要輸出中
- 每個訊號附帶「回測基礎」的說明，例如：「此訊號基於過去 24 個月滾動回測，平均勝率 XX%，相對於持有大盤超額 XX%」，讓使用者知道這不是憑空生成的
- **誠實揭露**：回測是歷史資料驗證，不保證未來表現，這句話要出現在每次輸出訊號的地方，不能只寫在 README 裡

## `internal/signal` 測試策略

- 用一組已知答案的假資料測試因子計算邏輯（例如手算 MA5 對答案）
- 針對 look-ahead 檢查邏輯寫專門的測試案例（故意塞入未來資料，驗證系統會擋下來）
- Walk-forward 切分邏輯要測試視窗邊界正確，不會重疊或漏掉交易日

## Phase 2 完成的定義（Definition of Done）

- [ ] MA / KD / MACD / RSI 計算完成並有單元測試驗證正確性
- [ ] 籌碼因子（連買連賣天數、N 日均買賣超）計算完成
- [ ] 因子打分與訊號分級邏輯完成
- [ ] Walk-forward 回測框架完成，可產出多視窗勝率與穩定度指標
- [ ] 回測結果附交易成本假設與 baseline 比較
- [ ] 至少一組訊號規則通過 walk-forward 驗證並記錄下來（即使勝率普通，誠實記錄也是有價值的產出）
- [ ] README / demo 附上回測結果圖表（勝率隨時間變化、與 baseline 比較）

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const md = document.getElementById("md-src").textContent;
const content = document.getElementById("content");
marked.setOptions({ gfm: true, breaks: false });
content.innerHTML = marked.parse(md);

/* 1. 標題 id + 錨點 */
const slugCount = {};
const slugify = (s) => {
  let base = s.trim().toLowerCase().replace(/[^\w一-鿿\- ]/g, "")
    .replace(/\s+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  if (!base) base = "s";
  slugCount[base] = (slugCount[base] || 0) + 1;
  return slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
};
content.querySelectorAll("h1, h2, h3, h4").forEach((h) => {
  h.id = h.id || slugify(h.textContent);
  const a = document.createElement("a");
  a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#";
  a.setAttribute("aria-label", "連結至此段");
  h.prepend(a);
});

/* 2. 引言卡片分類 */
content.querySelectorAll("blockquote").forEach((bq, i) => {
  const t = bq.textContent;
  if (/⛔|絕不|不可|洩漏|會掉資料|直接炸/.test(t)) bq.classList.add("crit");
  else if (/⚠|注意|但書|坑|陷阱|訂正|警告/.test(t)) bq.classList.add("warn");
  else if (/^\s*(模組|對照|姊妹|本 repo|日期|範圍)/.test(t) || i === 0) bq.classList.add("meta");
});

/* 3. mermaid fence */
content.querySelectorAll("code.language-mermaid").forEach((el) => {
  const pre = document.createElement("pre");
  pre.className = "mermaid"; pre.textContent = el.textContent;
  el.closest("pre").replaceWith(pre);
});

/* 4. 表格包捲動容器 */
content.querySelectorAll("table").forEach((tb) => {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  tb.parentNode.insertBefore(wrap, tb);
  wrap.appendChild(tb);
});

/* 5. .md 連結改指 .html；docs/0X 這種純文字不動 */
content.querySelectorAll("a[href$='.md']").forEach((a) => {
  a.href = a.getAttribute("href").replace(/\.md$/, ".html");
});

/* 6. 程式碼區塊複製鈕 */
content.querySelectorAll("pre > code").forEach((code) => {
  const pre = code.parentElement;
  if (pre.classList.contains("mermaid")) return;
  const btn = document.createElement("button");
  btn.className = "copy-btn"; btn.type = "button"; btn.textContent = "複製";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code.textContent);
      btn.textContent = "已複製"; setTimeout(() => (btn.textContent = "複製"), 1400);
    } catch { btn.textContent = "失敗"; setTimeout(() => (btn.textContent = "複製"), 1400); }
  });
  pre.appendChild(btn);
});

/* 7. 文件卡片牆：只在總覽頁有內容 */
const DOCS = [];
const h1 = content.querySelector("h1");
if (DOCS.length && h1) {
  const wall = document.createElement("div");
  wall.className = "doc-cards";
  wall.innerHTML = DOCS.map(d =>
    `<a href="./${d.href}"><div class="num">${d.num}</div><div class="t">${d.title}</div><div class="d">${d.desc}</div></a>`
  ).join("");
  let node = h1.nextElementSibling;
  while (node && node.tagName !== "HR") node = node.nextElementSibling;
  (node || h1).insertAdjacentElement("afterend", wall);
}

/* 8. 上一章 / 下一章 */
const chapters = [...document.querySelectorAll(".doc-switch a:not(.sister)")];
const curIdx = chapters.findIndex((a) => a.classList.contains("current"));
if (curIdx >= 0) {
  const prev = chapters[curIdx - 1], next = chapters[curIdx + 1];
  if (prev || next) {
    const pager = document.createElement("nav");
    pager.className = "pager";
    const cell = (a, dir, cls) => a
      ? `<a class="${cls}" href="${a.getAttribute("href")}"><span class="dir">${dir}</span><span class="t">${a.lastElementChild.textContent}</span></a>`
      : `<span style="flex:1 1 0"></span>`;
    pager.innerHTML = cell(prev, "上一章", "prev") + cell(next, "下一章", "next");
    content.appendChild(pager);
  }
}

/* 9. TOC */
const toc = document.getElementById("toc");
const heads = [...content.querySelectorAll("h1, h2, h3, h4")].filter(h => h !== h1);
heads.forEach((h) => {
  const a = document.createElement("a");
  a.href = "#" + h.id;
  a.className = "lvl-" + (h.tagName === "H1" ? 2 : h.tagName[1]);
  a.textContent = h.textContent.replace(/^#/, "").trim();
  a.dataset.k = a.textContent.toLowerCase();
  toc.appendChild(a);
});
const links = [...toc.querySelectorAll("a")];
const byId = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
const seen = new Set();
const io = new IntersectionObserver((es) => {
  es.forEach((e) => e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id));
  let first = null;
  for (const h of heads) if (seen.has(h.id)) { first = h.id; break; }
  if (!first) return;
  links.forEach((a) => a.classList.remove("active"));
  const cur = byId.get(first);
  if (cur) {
    cur.classList.add("active");
    const box = toc.parentElement.getBoundingClientRect();
    const r = cur.getBoundingClientRect();
    if (r.top < box.top + 40 || r.bottom > box.bottom - 40) cur.scrollIntoView({ block: "center" });
  }
}, { rootMargin: "0px 0px -72% 0px" });
heads.forEach((h) => io.observe(h));

const filter = document.getElementById("toc-filter");
filter.addEventListener("input", () => {
  const q = filter.value.trim().toLowerCase();
  links.forEach((a) => { a.style.display = !q || a.dataset.k.includes(q) ? "" : "none"; });
});

/* 10. 閱讀進度 */
const rp = document.getElementById("reading-progress");
const onScroll = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  rp.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
};
addEventListener("scroll", onScroll, { passive: true });
onScroll();

/* 11. 行動選單 */
const sidebar = document.getElementById("sidebar");
document.getElementById("menu-toggle").addEventListener("click", () => sidebar.classList.toggle("open"));
toc.addEventListener("click", () => sidebar.classList.remove("open"));

/* 12. mermaid */
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({
  startOnLoad: false, theme: dark ? "dark" : "base",
  securityLevel: "loose", fontFamily: "var(--font-sans)",
  themeVariables: dark ? {} : {
    primaryColor: "#f6f8fa", primaryBorderColor: "#8c959f", primaryTextColor: "#1f2328",
    lineColor: "#6b7480", secondaryColor: "#ddf4ff", tertiaryColor: "#fff8c5",
  },
});
await mermaid.run();

if (location.hash) {
  const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (el) el.scrollIntoView();
}
</script>
