# Phase 0 — 產品需求規格書（PRD）

> 本文件回答 **What & Why**（產品是什麼、為誰、有哪些功能、怎樣算做完）。
> 工程實作的 **How & When**（技術選型、開發順序）見 [ROADMAP.md](ROADMAP.md) 與各 phase 文件。
> 產品形態：**面向一般使用者（client）的台股盤後理解與學習產品**（web app + 每日推播）。
>
> 📌 **現狀聲明**：本文件為「產品化情境」下的規格設計演練，**現階段本專案未對外提供服務**，實際定位仍為個人學習與研究工具（見 README）。若未來決定對外，需先完成 §1.1 之法遵行動項並更新全 repo 定位聲明。

---

## 1. 產品定位

**一句話**：每天盤後，用白話幫使用者看懂台股今天發生什麼、就地學會投資術語，並提供「算法透明、經過回測」的因子數據研究——一個**教育與資訊整理**產品。

**電梯句（對 client）**：「收盤後 5 分鐘，看懂今天的台股。」

### 1.1 法遵紅線（產品範圍的第一決策，不是附註）

台灣《證券投資信託及顧問法》對「向不特定人提供證券投資建議」有規範。本產品是**對外服務**，因此：

| 內容 | 能不能對 client 提供 | 說明 |
| --- | --- | --- |
| 客觀數據彙整（行情/籌碼/新聞）| ✅ 可 | 公開資訊整理 |
| 白話解讀「發生了什麼現象」 | ✅ 可 | 教育性質，不涉及應否買賣 |
| 術語教學 | ✅ 可 | 教育性質 |
| 因子數據與歷史統計展示 | ✅ 可 | 呈現客觀計算結果與回測統計 |
| **多空分級標籤（偏多/偏空）** | ⚠️ **feature flag，預設關** | 系統性產出方向性標籤給不特定人＝模糊地帶，法遵評估通過前不對 client 開放；期間僅供內部研究 |
| 個股買賣建議、目標價 | ❌ 永不 | 明確紅線 |

- 全產品所有輸出載明「教育與資訊整理用途，非投資建議」。
- 問答助手被問「該不該買」一律觸發拒絕模板。
- **行動項**：正式對外前完成法遵諮詢；在此之前對外版本關閉分級標籤，只展示因子數據。

## 2. 目標使用者與痛點

| Persona | 描述 | 痛點 | 對應模組 |
| --- | --- | --- | --- |
| **投資新手**（主要）| 剛開始關注台股的上班族/學生，看得懂新聞看不懂術語 | 盤後資訊散落各處；術語密度高，查一個詞斷一次閱讀；不知道每天該看什麼 | M2 M3 M8 |
| **忙碌上班族**（主要）| 有投資但沒時間盯盤 | 收盤後想快速掌握當天重點與自己關注的股票 | M2 M8 M9 |
| **自學量化的研究者**（次要）| 想驗證「外資連買會漲」這類說法 | 網路訊號黑箱不可驗證 | M4 M5 |

## 3. 非目標（明確不做）

- ❌ 即時報價 / 盤中看盤（定位是「盤後理解」，也避開行情授權費）
- ❌ 買賣建議、目標價、進出場點位（法遵紅線）
- ❌ 下單、券商整合
- ❌ 台股以外市場
- ❌ 社群功能（留言/追蹤/分享名單）——先做好單人體驗

## 4. 功能模組總覽

```
client 視角:
  「幫我收資料」──── M1 市場資料中心（平台底座，client 無感但一切依賴它）
  「幫我看懂」────── M2 每日盤後解讀 ─┐
  「幫我學會」────── M3 術語教室       │
  「幫我研究」────── M4 因子研究室     ├─ M6 Web App（呈現層）
  「讓我提問」────── M5 個股問答助手   │
  「記住我關注的」── M8 帳號與自選股 ─┘
  「主動送到我手上」 M9 每日晨報推播
  「憑什麼信你」──── M7 信任機制（橫切全部模組）
```

| ID | 模組 | client 價值一句話 | 優先級 | 工程 phase | 狀態 |
| --- | --- | --- | --- | --- | --- |
| M1 | 市場資料中心 | 資料每天自動到位（平台能力）| **Must** | 1 | 規劃完成 |
| M2 | 每日盤後解讀 | 5 分鐘白話看懂今天的市場 | **Must** | 1 | 規劃完成 |
| M3 | 術語教室 | 術語在出現的地方就地學會 | **Must** | 1 | 規劃完成 |
| M7 | 信任機制 | 數字不造假、有據可查、明示非建議 | **Must** | 1–4 橫切 | 規劃完成 |
| M6 | Web App | 產品的主要介面 | **Must** | 4 | 規劃完成 |
| M8 | 帳號與自選股 | 記住我、只給我關心的 | Should | **5（新增）** | **待規劃** |
| M9 | 每日晨報推播 | 不用打開網站，重點送上門 | Should | **5（新增）** | **待規劃** |
| M5 | 個股問答助手 | 問個股，附出處回答 | Should | 3 | 規劃完成 |
| M4 | 因子研究室 | 因子數據透明並經回測（分級標籤法遵後開放）| Could | 2' | 規劃完成 + 法遵待辦 |

> **MVP（首個對外版本）= M1 + M2 + M3 + M6（摘要頁）+ M7**：每天自動產出的白話盤後解讀網頁。M8/M9 是第二版（留存關鍵）。M4 分級與 M5 依法遵與品質成熟度逐步開放。

## 5. 模組規格

### M1 市場資料中心（平台底座）

**目標**：client 零感知，資料每天自動到位；歷史資料日積月累。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-1.1 | 平日盤後自動抓大盤/三大法人/全市場個股日K | 17:30 觸發、18:00 前完成；非交易日自動跳過 |
| FR-1.2 | 財金新聞自動抓取 | 每 30 分鐘；同篇不重複 |
| FR-1.3 | 抓取冪等 | 同日重跑任意次資料不重複 |
| FR-1.4 | 歷史回補 | 可回補指定個股/區間，受限速保護 |
| FR-1.5 | 失敗可觀察 | 重試 3 次 + 告警 log；資料缺漏隔日可補 |
| FR-1.6 | 資料延遲承諾 | 對 client 標示資料時間（「資料截至 8/7 收盤」），過期資料不冒充最新 |

### M2 每日盤後解讀

**目標**：每天 18:30 前產出 200–300 字白話摘要——產品的每日核心內容。

**使用者故事**：作為新手，我每天收盤後想用一段白話文了解大盤與法人動向，而不是自己解讀一堆數字；作為使用者，我想回看任意日期。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-2.1 | 每日自動生成並發布 | 18:30 前上線；涵蓋大盤、三大法人 |
| FR-2.2 | 數字 100% 來自真實資料 | 程式代入模板，LLM 不生成數字（M7）；抽驗零錯誤 |
| FR-2.3 | 只解讀現象不給建議 | 建議性字眼出現率 0%（eval 把關）|
| FR-2.4 | 歷史回看 | 任意日期可查 |
| FR-2.5 | 免責常駐 | 每則載明教育用途聲明 |

### M3 術語教室

**目標**：術語出現在哪，就在哪學會——產品的「教育」骨幹。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-3.1 | 術語辭典 | 首發 ≥ 10 詞，可持續擴充 |
| FR-3.2 | 每日摘要內建教學 | 至少 1 個當日數據實際出現的術語 |
| FR-3.3 | 解釋有據可循 | 以辭典為準，LLM 不自行發明定義 |
| FR-3.4 | 就地顯示 | 網頁術語 hover 即顯示，不跳頁 |
| FR-3.5 | 術語頁 | 辭典可瀏覽/搜尋（SEO 與自然流量入口）|

### M4 因子研究室（含法遵 gate）

**目標**：提供「怎麼算的看得見、歷史統計誠實揭露」的因子研究。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-4.1 | 因子計算與展示 | 技術指標 + 籌碼因子，數據與計算方式公開 |
| FR-4.2 | 因子貢獻可解釋 | 分數附各因子貢獻明細，加總可驗算 |
| FR-4.3 | 回測誠實呈現 | 勝率、視窗穩定度、vs 大盤、最大回撤 +「歷史不代表未來」每次顯示 |
| FR-4.4 | **分級標籤 feature flag** | 「偏多/偏空」標籤預設對 client 關閉；法遵評估通過才開。關閉時只展示因子數據與統計 |
| FR-4.5 | 未過回測不出現 | 未通過 walk-forward 的規則不進任何 client 可見輸出 |

### M5 個股問答助手

**目標**：自然語言問個股，agent 自查資料、附出處回答。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-5.1 | 個股問答 | 自主選工具取數；數字與工具回傳一致（trace 比對）|
| FR-5.2 | 引用溯源 | 新聞引用附標題/日期/連結且真實存在 |
| FR-5.3 | 拒答邊界 | 買賣建議類 100% 觸發拒絕模板 |
| FR-5.4 | 過程透明 | 工具呼叫過程可展開查看（trace 側欄）|
| FR-5.5 | 誠實查無 | 檢索不到就說查無，不補腦 |
| FR-5.6 | 用量保護 | 每使用者每日提問上限（成本控制），超限友善提示 |

### M6 Web App

**目標**：產品主介面；桌面優先、行動可用。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-6.1 | 今日摘要頁（首頁）| 走勢圖 + 法人柱狀 + 摘要 + 術語 tooltip + 日期回看；未登入可看（獲客入口）|
| FR-6.2 | 個股頁 | K 線疊 MA + 因子數據 + 回測統計（分級標籤受 FR-4.4 gate）|
| FR-6.3 | 對話頁 | 訊息串 + 引用可點 + trace 側欄（登入後可用，FR-5.6 限額）|
| FR-6.4 | 品質頁 | eval pass rate 與失敗案例公開（M7 可視化，信任賣點）|
| FR-6.5 | 免責常駐 | 每頁 footer + 內容內，文案後端統一下發 |

### M7 信任機制（橫切）

**目標**：「這個產品知道自己哪裡不可信」——相對一般 AI 產品的核心差異，也是法遵的技術防線。

| # | 需求 | 落在 | 驗收標準 |
| --- | --- | --- | --- |
| FR-7.1 | 數字防幻覺 | M2/M5 | 數字由程式代入或工具回傳，LLM 不生成 |
| FR-7.2 | 輸出忠實度驗證 | M2 | eval set ≥ 20 組；改 prompt 必重跑；低於門檻擋上線 |
| FR-7.3 | 引用溯源 | M5 | 無法溯源的事實句視為缺陷 |
| FR-7.4 | 建議黑名單 | M2/M5 | 建議性字眼出現率 0%，上線前自動掃描 |
| FR-7.5 | 品質公開 | M6 | eval 歷史對 client 公開 |
| FR-7.6 | 免責與定位 | 全部 | 所有輸出載明教育用途 |

### M8 帳號與自選股（待規劃 → 工程 phase 5）

**目標**：記住使用者、個人化內容——留存的地基。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-8.1 | 註冊/登入 | Email magic link 或 OAuth（Google），不自管密碼 |
| FR-8.2 | 自選股清單 | 加入/移除個股；摘要與晨報優先呈現自選股 |
| FR-8.3 | 個人化摘要 | 每日摘要附「你的自選股」段落（同樣走 M7 防線）|
| FR-8.4 | 資料最小化 | 只收 email；可自行刪除帳號與資料 |

### M9 每日晨報推播（待規劃 → 工程 phase 5）

**目標**：內容主動送達——不依賴使用者記得打開網站。

| # | 需求 | 驗收標準 |
| --- | --- | --- |
| FR-9.1 | 每日 email 晨報 | 開盤前送達（如 08:00）；含昨日摘要 + 自選股數據 + 1 個術語 |
| FR-9.2 | 訂閱管理 | 一鍵退訂；退訂即停 |
| FR-9.3 | 通道可擴充 | 先 email，LINE Notify 列為後續 |
| FR-9.4 | 內容同紀律 | 晨報內容過同一套 M7 防線與免責 |

| 階段 | 指標 | 目標 |

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const md = document.getElementById("md-src").textContent;
const content = document.getElementById("content");
marked.setOptions({ gfm: true, breaks: false });
content.innerHTML = marked.parse(md);

/* 1. 標題 id + 錨點 */
const slugCount = {};
const slugify = (s) => {
  let base = s.trim().toLowerCase().replace(/[^\w一-鿿\- ]/g, "")
    .replace(/\s+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  if (!base) base = "s";
  slugCount[base] = (slugCount[base] || 0) + 1;
  return slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
};
content.querySelectorAll("h1, h2, h3, h4").forEach((h) => {
  h.id = h.id || slugify(h.textContent);
  const a = document.createElement("a");
  a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#";
  a.setAttribute("aria-label", "連結至此段");
  h.prepend(a);
});

/* 2. 引言卡片分類 */
content.querySelectorAll("blockquote").forEach((bq, i) => {
  const t = bq.textContent;
  if (/⛔|絕不|不可|洩漏|會掉資料|直接炸/.test(t)) bq.classList.add("crit");
  else if (/⚠|注意|但書|坑|陷阱|訂正|警告/.test(t)) bq.classList.add("warn");
  else if (/^\s*(模組|對照|姊妹|本 repo|日期|範圍)/.test(t) || i === 0) bq.classList.add("meta");
});

/* 3. mermaid fence */
content.querySelectorAll("code.language-mermaid").forEach((el) => {
  const pre = document.createElement("pre");
  pre.className = "mermaid"; pre.textContent = el.textContent;
  el.closest("pre").replaceWith(pre);
});

/* 4. 表格包捲動容器 */
content.querySelectorAll("table").forEach((tb) => {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  tb.parentNode.insertBefore(wrap, tb);
  wrap.appendChild(tb);
});

/* 5. .md 連結改指 .html；docs/0X 這種純文字不動 */
content.querySelectorAll("a[href$='.md']").forEach((a) => {
  a.href = a.getAttribute("href").replace(/\.md$/, ".html");
});

/* 6. 程式碼區塊複製鈕 */
content.querySelectorAll("pre > code").forEach((code) => {
  const pre = code.parentElement;
  if (pre.classList.contains("mermaid")) return;
  const btn = document.createElement("button");
  btn.className = "copy-btn"; btn.type = "button"; btn.textContent = "複製";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code.textContent);
      btn.textContent = "已複製"; setTimeout(() => (btn.textContent = "複製"), 1400);
    } catch { btn.textContent = "失敗"; setTimeout(() => (btn.textContent = "複製"), 1400); }
  });
  pre.appendChild(btn);
});

/* 7. 文件卡片牆：只在總覽頁有內容 */
const DOCS = [];
const h1 = content.querySelector("h1");
if (DOCS.length && h1) {
  const wall = document.createElement("div");
  wall.className = "doc-cards";
  wall.innerHTML = DOCS.map(d =>
    `<a href="./${d.href}"><div class="num">${d.num}</div><div class="t">${d.title}</div><div class="d">${d.desc}</div></a>`
  ).join("");
  let node = h1.nextElementSibling;
  while (node && node.tagName !== "HR") node = node.nextElementSibling;
  (node || h1).insertAdjacentElement("afterend", wall);
}

/* 8. 上一章 / 下一章 */
const chapters = [...document.querySelectorAll(".doc-switch a:not(.sister)")];
const curIdx = chapters.findIndex((a) => a.classList.contains("current"));
if (curIdx >= 0) {
  const prev = chapters[curIdx - 1], next = chapters[curIdx + 1];
  if (prev || next) {
    const pager = document.createElement("nav");
    pager.className = "pager";
    const cell = (a, dir, cls) => a
      ? `<a class="${cls}" href="${a.getAttribute("href")}"><span class="dir">${dir}</span><span class="t">${a.lastElementChild.textContent}</span></a>`
      : `<span style="flex:1 1 0"></span>`;
    pager.innerHTML = cell(prev, "上一章", "prev") + cell(next, "下一章", "next");
    content.appendChild(pager);
  }
}

/* 9. TOC */
const toc = document.getElementById("toc");
const heads = [...content.querySelectorAll("h1, h2, h3, h4")].filter(h => h !== h1);
heads.forEach((h) => {
  const a = document.createElement("a");
  a.href = "#" + h.id;
  a.className = "lvl-" + (h.tagName === "H1" ? 2 : h.tagName[1]);
  a.textContent = h.textContent.replace(/^#/, "").trim();
  a.dataset.k = a.textContent.toLowerCase();
  toc.appendChild(a);
});
const links = [...toc.querySelectorAll("a")];
const byId = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
const seen = new Set();
const io = new IntersectionObserver((es) => {
  es.forEach((e) => e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id));
  let first = null;
  for (const h of heads) if (seen.has(h.id)) { first = h.id; break; }
  if (!first) return;
  links.forEach((a) => a.classList.remove("active"));
  const cur = byId.get(first);
  if (cur) {
    cur.classList.add("active");
    const box = toc.parentElement.getBoundingClientRect();
    const r = cur.getBoundingClientRect();
    if (r.top < box.top + 40 || r.bottom > box.bottom - 40) cur.scrollIntoView({ block: "center" });
  }
}, { rootMargin: "0px 0px -72% 0px" });
heads.forEach((h) => io.observe(h));

const filter = document.getElementById("toc-filter");
filter.addEventListener("input", () => {
  const q = filter.value.trim().toLowerCase();
  links.forEach((a) => { a.style.display = !q || a.dataset.k.includes(q) ? "" : "none"; });
});

/* 10. 閱讀進度 */
const rp = document.getElementById("reading-progress");
const onScroll = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  rp.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
};
addEventListener("scroll", onScroll, { passive: true });
onScroll();

/* 11. 行動選單 */
const sidebar = document.getElementById("sidebar");
document.getElementById("menu-toggle").addEventListener("click", () => sidebar.classList.toggle("open"));
toc.addEventListener("click", () => sidebar.classList.remove("open"));

/* 12. mermaid */
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({
  startOnLoad: false, theme: dark ? "dark" : "base",
  securityLevel: "loose", fontFamily: "var(--font-sans)",
  themeVariables: dark ? {} : {
    primaryColor: "#f6f8fa", primaryBorderColor: "#8c959f", primaryTextColor: "#1f2328",
    lineColor: "#6b7480", secondaryColor: "#ddf4ff", tertiaryColor: "#fff8c5",
  },
});
await mermaid.run();

if (location.hash) {
  const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (el) el.scrollIntoView();
}
</script>
